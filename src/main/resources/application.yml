
spring:
  application:
    name: ledger-recon

  datasource:
    url: jdbc:h2:file:./data/recondb;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 8080

logging:
  level:
    org.springframework.batch: INFO
    com.sudayagiri.ledgerrecon: INFO
